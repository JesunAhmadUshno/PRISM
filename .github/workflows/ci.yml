# PRISM quality gate.
#
# Runs on every push and pull request. This is the check that must be green
# before deploy.yml is allowed to ship anything to GitHub Pages.
#
# HONEST STATUS, VERIFIED LOCALLY ON THIS COMMIT:
#   - typecheck : PASSES (tsc --noEmit is clean)
#   - lint      : PASSES with 0 errors and 116 warnings. .eslintrc.cjs now exists.
#                 The script has no --max-warnings, so warnings do not fail the job;
#                 `npm run lint:strict` is the --max-warnings 0 form and is NOT yet
#                 green. Tightening to lint:strict is the follow-up, not a bypass.
#   - test      : PASSES - 98 unit tests (vitest.config.ts) + 12 accessibility tests
#                 (vitest.a11y.config.ts). The a11y suite is a SEPARATE config and is
#                 excluded from the default one, so it needs its own step below.
#   - build     : PASSES (largest chunk vendor-charts at ~441 kB, under the 500 kB limit)
#
# Nothing here is allowed to acquire `--passWithNoTests` or `continue-on-error`.
# The README no longer asserts WCAG 2.2 AAA or ISO/IEC 27001 conformance, because
# neither was ever verified. What it claims now is narrower and checkable, and
# these suites are what make it checkable. Fix the repo, not the gate.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs for the same ref. Keyed on the workflow as well as the
# ref so this never fights deploy.yml, which uses the separate 'pages' group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # npm ci, not npm install: package-lock.json is committed and CI must build
      # the exact tree the lockfile pins, never silently resolve a new one.
      - name: Install dependencies
        run: npm ci

      # Every step below is `if: ${{ !cancelled() }}` so a single run reports ALL
      # of the failures at once instead of hiding the build behind a lint error.
      # The job still fails: a failed step fails the job regardless of what runs after.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      # Called directly rather than via `npm test`, because that script is bare
      # `vitest`, which starts the interactive watcher and would hang until the
      # job timeout. `vitest run` is the one-shot form.
      - name: Test with coverage
        if: ${{ !cancelled() }}
        run: npx vitest run --coverage

      # The accessibility suite lives behind its own config and is explicitly
      # excluded from vitest.config.ts, so the step above does NOT run it. Without
      # this step the 12 axe-core tests backing the README's WCAG 2.2 claim would
      # sit in the repo never executing. Called as `vitest run --config`, not via
      # `npm run test:a11y`, because that script is bare `vitest` (watch mode).
      - name: Accessibility tests
        if: ${{ !cancelled() }}
        run: npx vitest run --config vitest.a11y.config.ts

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # HARD GATE. This step fails the run.
      #
      # It was advisory-only while two advisories existed that no pull request
      # author could resolve: a transitive brace-expansion ReDoS, and xlsx@0.18.5,
      # the deprecated SheetJS npm build whose advisories npm reports as
      # fixAvailable:false because the registry copy is frozen at the vulnerable
      # version. A gate that is red for reasons an author cannot fix gets muted,
      # and then it gates nothing.
      #
      # Both are now resolved. xlsx is removed from the tree entirely, replaced by
      # SheetJS 0.20.3 vendored in public/vendor/ and loaded with an SHA-384
      # integrity hash. The transitive advisories cleared with `npm audit fix`,
      # which required major bumps of vite and vitest. `npm audit` reports zero
      # vulnerabilities at any severity, so the acceptance criterion named in the
      # previous version of this comment is met and continue-on-error is gone.
      #
      # If this turns red, a dependency picked up an advisory. Fix the dependency.
      # Do not re-add continue-on-error.
      - name: npm audit
        run: npm audit --audit-level=high
