# Deploy PRISM to GitHub Pages.
#
# The site is assembled from two independent pieces:
#
#   web/    a hand written marketing site, no build step, no dependencies.
#           It goes to the ROOT, so https://<user>.github.io/PRISM/
#
#   dist/   the Vite application build.
#           It goes to /app/, so https://<user>.github.io/PRISM/app/
#
#   site/   the research lab dashboard, its own Vite package (vite base
#           '/PRISM/lab/'). It goes to /lab/, so https://<user>.github.io/PRISM/lab/
#           Its build first runs site/src/stats.check.mjs, which recomputes the
#           detector's recorded numbers and fails the deploy if they drift.
#
# There is one Pages artifact per repo, so all three are assembled here; a
# second Pages workflow would replace the marketing site and the app.
#
# vite.config.ts sets base to '/PRISM/app/' to match. Anything that builds a
# runtime URL inside the app reads import.meta.env.BASE_URL rather than
# hardcoding a path, including the vendored SheetJS loader, so the two stay
# in step as long as those two values agree.

name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # A failing test must not reach the public URL. ci.yml runs the full gate
      # on the same push, but it is a separate workflow and cannot block this
      # one, so the tests that matter run here too. `npm run build` already
      # fails on a type error, since the script is `tsc && vite build`.
      - name: Test before shipping
        run: npx vitest run

      - name: Accessibility tests
        run: npx vitest run --config vitest.a11y.config.ts

      - name: Build the application
        run: npm run build

      # The lab has its own lockfile and exact pins. `npm run build` runs the
      # known-answer check (node src/stats.check.mjs) before vite build.
      - name: Build the lab dashboard
        working-directory: site
        run: |
          npm ci
          npm run build

      # Marketing site at the root, application underneath it at /app/.
      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/app
          cp -R web/. _site/
          cp -R dist/. _site/app/
          mkdir -p _site/lab
          cp -R site/dist/. _site/lab/
          # Pages runs Jekyll by default, which silently drops files and
          # directories beginning with an underscore. Vite does not emit any
          # today, but a future plugin might, and the failure would be a
          # missing asset in production with a green build.
          touch _site/.nojekyll
          echo "--- assembled ---"
          ls -la _site
          echo "--- app ---"
          ls -la _site/app | head -12

      # Fail loudly here rather than shipping a site whose links 404.
      - name: Verify the assembly
        run: |
          set -euo pipefail
          test -f _site/index.html          || { echo "marketing index missing"; exit 1; }
          test -f _site/styles.css          || { echo "marketing styles missing"; exit 1; }
          test -f _site/app/index.html      || { echo "app index missing"; exit 1; }
          test -d _site/app/vendor          || { echo "vendored SheetJS missing"; exit 1; }
          grep -q '/PRISM/app/' _site/app/index.html || { echo "app was not built with base /PRISM/app/"; exit 1; }
          test -f _site/lab/index.html      || { echo "lab index missing"; exit 1; }
          grep -q '/PRISM/lab/' _site/lab/index.html || { echo "lab was not built with base /PRISM/lab/"; exit 1; }
          echo "assembly verified"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
