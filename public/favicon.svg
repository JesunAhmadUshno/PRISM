<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="prismGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Prism shape -->
  <polygon 
    points="50,5 95,85 5,85" 
    fill="url(#prismGradient)" 
    stroke="#0c4a6e" 
    stroke-width="2"
  />
  
  <!-- Light refraction lines -->
  <line x1="50" y1="25" x2="25" y2="70" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
  <line x1="50" y1="25" x2="50" y2="70" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
  <line x1="50" y1="25" x2="75" y2="70" stroke="#fff" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Data points -->
  <circle cx="30" cy="55" r="3" fill="#fff"/>
  <circle cx="50" cy="45" r="3" fill="#fff"/>
  <circle cx="70" cy="60" r="3" fill="#fff"/>
</svg>
