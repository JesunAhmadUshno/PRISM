<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Main gradient for the prism -->
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    
    <!-- Light beam gradients -->
    <linearGradient id="beamBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="beamGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22c55e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#84cc16" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="beamPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ec4899" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="1"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#0f172a"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#prismGrad)" stroke-width="2" opacity="0.3"/>
  
  <!-- Light beams (refracted output) -->
  <g filter="url(#glow)">
    <line x1="300" y1="200" x2="420" y2="140" stroke="url(#beamBlue)" stroke-width="6" stroke-linecap="round"/>
    <line x1="300" y1="256" x2="440" y2="256" stroke="url(#beamGreen)" stroke-width="6" stroke-linecap="round"/>
    <line x1="300" y1="312" x2="420" y2="372" stroke="url(#beamPink)" stroke-width="6" stroke-linecap="round"/>
  </g>
  
  <!-- Input beam -->
  <line x1="80" y1="256" x2="180" y2="256" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Main Prism shape -->
  <g filter="url(#shadow)">
    <polygon 
      points="180,120 320,256 180,392" 
      fill="url(#prismGrad)"
    />
    <!-- Prism highlight -->
    <polygon 
      points="180,120 230,180 180,240" 
      fill="#fff" 
      opacity="0.2"
    />
    <!-- Prism edge line -->
    <line x1="180" y1="120" x2="180" y2="392" stroke="#fff" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Data points on beams -->
  <circle cx="380" cy="160" r="8" fill="#3b82f6"/>
  <circle cx="400" cy="256" r="8" fill="#22c55e"/>
  <circle cx="380" cy="352" r="8" fill="#ec4899"/>
</svg>
